name: Starter Static Quality

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f src/DextEnterpriseStarter.dpr
          test -f src/Infrastructure/App.DbContext.pas
          test -f src/Features/Accounts/Domain/Accounts.Models.pas
          test -f src/Features/Accounts/Application/Accounts.Service.pas
          test -f database/postgresql/01_schema.sql
          test -f database/postgresql/02_seed.sql
          test -f docs/DEXT_NATIVE_ALIGNMENT.md
          test -f AGENTS.md
          test -f .env.example

      - name: Require official Dext startup composition
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'TAppStartup = class(TInterfacedObject, IStartup)' src/App.Startup.pas
          grep -n 'procedure ConfigureServices(const Services: TDextServices; const Configuration: IConfiguration)' src/App.Startup.pas
          grep -n 'procedure Configure(const App: IWebApplication)' src/App.Startup.pas
          grep -n 'App.UseStartup(TAppStartup.Create)' src/DextEnterpriseStarter.dpr

      - name: Require Dext Entity architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'TAppDbContext = class(TDbContext)' src/Infrastructure/App.DbContext.pas
          grep -n 'IDbSet<TAccount>' src/Infrastructure/App.DbContext.pas
          grep -n 'FmtBcdType' src/Features/Accounts/Domain/Accounts.Models.pas
          grep -n 'Precision(28, 10)' src/Features/Accounts/Domain/Accounts.Models.pas
          grep -n 'AddDbContext<TAppDbContext>' src/App.Startup.pas
          grep -n 'UsePostgreSQL' src/App.Startup.pas
          grep -n 'WithPooling(True)' src/App.Startup.pas
          grep -n 'Prototype.Entity<TAccount>' src/Features/Accounts/Application/Accounts.Service.pas
          grep -n 'FDb.Accounts.Update(Account)' src/Features/Accounts/Application/Accounts.Service.pas

      - name: Reject manual CRUD persistence wrappers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'TFDQuery|TFDConnection|IAccountRepository|IDbConnectionFactory' src --include='*.pas'; then
            echo 'Manual persistence wrapper detected; ordinary CRUD must use Dext Entity ORM'
            exit 1
          fi

      - name: Require native Dext auth
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn 'IJwtTokenHandler' src --include='*.pas'
          grep -RIn 'TJwtTokenHandler' src --include='*.pas'
          grep -RIn 'TClaimsBuilder' src --include='*.pas'
          grep -RIn 'UseJwtAuthentication' src --include='*.pas'
          grep -RIn 'RequireAuthorization' src/Features --include='*.pas'

      - name: Guard route syntax
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "'/[^']*:[A-Za-z_][A-Za-z0-9_]*" src --include='*.pas'; then
            echo 'Legacy :param route syntax detected'
            exit 1
          fi

      - name: Guard service locator in HTTP layer
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'RequestServices\.GetService|Context\.Services\.GetService' src/Features --include='*.pas'; then
            echo 'Request service locator detected'
            exit 1
          fi

      - name: Guard financial precision
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn 'TBcd' src/Features/Accounts src/Shared --include='*.pas'
          grep -n 'NUMERIC(28,10)' database/postgresql/01_schema.sql

      - name: Guard database profile
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'UniDAC|TUniConnection|TUniQuery|FireDAC\.Phys\.FB|dpFirebird' src --include='*.pas'; then
            echo 'Legacy UniDAC/Firebird reference detected'
            exit 1
          fi

      - name: Ensure secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          test ! -f config/appsettings.json
          if git grep -nE 'DEXT_JWT_SECRET=.{32,}' -- ':!*.example' ':!.env.example' ':!.github/workflows/static-quality.yml'; then
            echo 'Possible committed JWT secret detected'
            exit 1
          fi
